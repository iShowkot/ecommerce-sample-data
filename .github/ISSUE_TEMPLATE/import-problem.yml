name: Import problem
description: A file didn't import cleanly into WooCommerce or Shopify.
labels: ["bug"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - WooCommerce
        - Shopify
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Platform version
      description: For WooCommerce, the version from WooCommerce > Status. For Shopify, the date you imported.
      placeholder: WooCommerce 11.2.0
    validations:
      required: true
  - type: dropdown
    id: file
    attributes:
      label: File
      options:
        - woocommerce/products.csv
        - woocommerce/products-imperial.csv
        - woocommerce/products-small.csv
        - shopify/products.csv
        - shopify/products-small.csv
    validations:
      required: true
  - type: input
    id: ref
    attributes:
      label: File version
      description: The release tag you downloaded, or "main".
      placeholder: v1.0.0
  - type: textarea
    id: error
    attributes:
      label: What happened
      description: Paste the importer's error messages, including the products or rows they mention.
    validations:
      required: true
