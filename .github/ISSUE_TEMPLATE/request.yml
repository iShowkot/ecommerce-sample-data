name: Product or feature request
description: Suggest a product type, edge case or file that would help you test.
labels: ["enhancement"]
body:
  - type: textarea
    id: request
    attributes:
      label: What would you like?
      description: For example a product type, an option combination, an awkward value or a new kind of file.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What would it help you test?
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - WooCommerce
        - Shopify
        - Other
